<section class="mt-8" aria-labelledby="faq-heading">
  <h2 id="faq-heading" class="text-lg font-bold uppercase tracking-wide text-white">Frequently asked questions</h2>
  <div class="mt-3 space-y-3">
    {% for faq in page.faqs %}
      <details class="rounded-xl border border-slate-700/80 bg-[#0d1c2b] p-4 sm:p-5">
        <summary class="cursor-pointer font-semibold text-white marker:text-cyan-300">{{ faq.question | escape }}</summary>
        <p class="mt-3 text-sm leading-6 text-slate-300">{{ faq.answer | escape }}</p>
      </details>
    {% endfor %}
  </div>
</section>
