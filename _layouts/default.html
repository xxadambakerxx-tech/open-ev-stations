<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/tailwind.css' | relative_url }}">
  </head>
  <body class="min-h-screen bg-slate-950 font-sans text-slate-100 antialiased">
    <div class="relative isolate overflow-hidden">
      <div aria-hidden="true" class="absolute inset-x-0 top-0 -z-10 h-[34rem] bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-emerald-900/35 via-slate-950 to-slate-950"></div>

      <header class="mx-auto flex max-w-7xl items-center justify-between px-6 py-6 lg:px-8">
        <a href="{{ '/' | relative_url }}" class="flex items-center gap-3 font-semibold tracking-tight text-white">
          <span class="flex size-10 items-center justify-center rounded-xl bg-emerald-400 text-slate-950" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" class="size-6" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 2.75 6.75 13h5l-1.25 8.25L17.25 11h-5l1.25-8.25Z" />
            </svg>
          </span>
          <span>{{ site.title | escape }}</span>
        </a>
        <a href="#about" class="text-sm font-medium text-slate-300 transition hover:text-emerald-300">About the project</a>
      </header>

      <main>
        {{ content }}
      </main>

      <footer class="mx-auto flex max-w-7xl flex-col gap-3 border-t border-white/10 px-6 py-8 text-sm text-slate-400 sm:flex-row sm:items-center sm:justify-between lg:px-8">
        <p>&copy; {{ "now" | date: "%Y" }} {{ site.title | escape }}</p>
        <p>Open data makes every journey a little easier.</p>
      </footer>
    </div>
  </body>
</html>
