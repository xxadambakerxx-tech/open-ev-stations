---
layout: default
---

<article class="mx-auto max-w-3xl px-4 py-8 sm:px-6 sm:py-12 lg:px-8">
  <a href="{{ '/' | relative_url }}#glove-box" class="inline-flex items-center gap-2 text-sm font-semibold text-cyan-200 transition hover:text-cyan-100">
    <svg viewBox="0 0 20 20" fill="currentColor" class="size-4 rotate-90" aria-hidden="true">
      <path fill-rule="evenodd" d="M5.22 7.47a.75.75 0 0 1 1.06 0L10 11.19l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 8.53a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
    </svg>
    Back to guides
  </a>

  <header class="mt-7 rounded-2xl border border-slate-700/80 bg-gradient-to-br from-[#112d3a] via-[#0d1c2b] to-[#0b1724] p-6 sm:p-9">
    <p class="text-xs font-bold uppercase tracking-[0.2em] text-cyan-300">For the glove box · {{ page.date | date: "%B %-d, %Y" }}</p>
    <h1 class="mt-3 text-3xl font-bold tracking-tight text-white sm:text-5xl">{{ page.title | escape }}</h1>
    {% if page.excerpt %}
      <p class="mt-4 text-base leading-7 text-slate-300">{{ page.excerpt | strip_html }}</p>
    {% endif %}
  </header>

  <div class="mt-8 space-y-4 text-sm leading-7 text-slate-300">
    {{ content }}
  </div>
</article>
