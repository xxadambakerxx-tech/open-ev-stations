name: Update station data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-station-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch station data
        env:
          AFDC_API_KEY: ${{ secrets.AFDC_API_KEY }}
        run: python tools/fetch_stations.py

      - name: Create pull request
        id: create-pull-request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/update-station-data
          add-paths: _data/destination_chargers.json
          commit-message: Update AFDC destination station data
          title: Update AFDC destination station data
          body: Automatically generated station data update.

      - name: Merge pull request
        if: steps.create-pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.create-pull-request.outputs.pull-request-number }}" --merge --admin --delete-branch