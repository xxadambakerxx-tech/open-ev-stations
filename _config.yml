title: Open EV Stations
description: A directory of hotel destination chargers, RV-friendly EV hookups, and charging stops for electric road trips.
url: "https://open-ev-stations.xxadambakerxx.workers.dev"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
permalink: /blog/:title/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-last-modified-at

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - tools
  - test
  - external_data
  - assets/css/tailwind.input.css
