title: Open EV Stations
description: A directory of hotel destination chargers, RV-friendly EV hookups, and charging stops for electric road trips.
url: "https://open-ev-stations.us"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
permalink: /blog/:title/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-last-modified-at
  - jekyll-archives

jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: topic_archive
    tag: topic_archive
  permalinks:
    category: /guides/category/:name/
    tag: /guides/tag/:name/

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - tools
  - test
  - external_data
  - assets/css/tailwind.input.css
